<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login · MathGrade</title>
  <style>
    :root{
      --text:#e5e7eb; --muted:#a7b0c0;
      --shadow: 0 30px 80px rgba(0,0,0,.35);
      --radius:18px;
      --good:#22c55e; --bad:#ef4444; --warn:#f59e0b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 10% 10%, rgba(245,158,11,.20), transparent 55%),
        radial-gradient(900px 700px at 90% 20%, rgba(56,189,248,.20), transparent 55%),
        radial-gradient(900px 700px at 70% 90%, rgba(167,139,250,.15), transparent 55%),
        linear-gradient(135deg, #050816, #070a1a 35%, #040615);
      min-height:100vh;
    }
    .wrap{max-width:820px;margin:0 auto;padding:42px 18px 70px;}
    h1{margin:0;font-size:32px;letter-spacing:-.02em;}
    .sub{margin-top:8px;color:var(--muted);max-width:70ch;line-height:1.5}
    .card{
      margin-top:18px;
      background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.04));
      border:1px solid rgba(255,255,255,.12);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .inner{
      padding:18px;
      background: rgba(11,18,32,.60);
      backdrop-filter: blur(10px);
    }
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;}
    input{
      flex:1;
      min-width:260px;
      padding:12px 12px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      outline:none;
      font-size:14px;
    }
    button{
      appearance:none;border:0;border-radius:12px;
      padding:12px 14px;cursor:pointer;
      font-weight:900;
      background: #f59e0b;
      color:#06101f;
      box-shadow:0 10px 30px rgba(0,0,0,.18);
    }
    button.secondary{
      background: rgba(255,255,255,.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow:none;
      font-weight: 750;
    }
    .msg{margin-top:10px;color:var(--muted);white-space:pre-wrap;font-size:12px;line-height:1.4}
    a{color:inherit}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Admin Login</h1>
    <div class="sub">
      Enter the admin code to open the Teacher Portal.
    </div>

    <div class="card">
      <div class="inner">
        <div class="row">
          <input id="pw" type="password" placeholder="Admin code…" autocomplete="off" />
          <button id="go" type="button">Open Portal →</button>
          <button id="back" class="secondary" type="button">← Back</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>
  </div>

<script>
  const API_BASE = "http://localhost:8000";
  const ENDPOINT_LOGIN = API_BASE + "/api/login";

  const LS_ROLE = "mathgrade_role";
  const LS_CODE = "mathgrade_code";

  const pwEl = document.getElementById("pw");
  const msgEl = document.getElementById("msg");

  async function openPortal() {
    const code = (pwEl.value || "").trim();
    if (!code) {
      msgEl.textContent = "Please enter the admin code.";
      return;
    }
    msgEl.textContent = "Checking…";

    try {
      // Use the same /api/login endpoint; it returns role=teacher for admin code
      const res = await fetch(ENDPOINT_LOGIN, {
        method: "POST",
        headers: {"content-type":"application/json"},
        body: JSON.stringify({ code }),
      });

      if (!res.ok) {
        const t = await res.text();
        msgEl.textContent = "Login failed: " + t;
        return;
      }

      const j = await res.json();
      if (!j.ok || j.role !== "teacher") {
        msgEl.textContent = "Not an admin code.";
        return;
      }

      // Save session so index logout works consistently
      localStorage.setItem(LS_ROLE, "teacher");
      localStorage.setItem(LS_CODE, code);

      // Redirect into teacher portal (same pattern you already use)
      window.location.href = API_BASE + "/teacher?p=" + encodeURIComponent(code);
    } catch (e) {
      msgEl.textContent = "Login error: " + (e?.message || String(e));
    }
  }

  document.getElementById("go").addEventListener("click", openPortal);
  pwEl.addEventListener("keydown", (e) => { if (e.key === "Enter") openPortal(); });

  document.getElementById("back").addEventListener("click", () => {
    window.location.href = "/";
  });
</script>
</body>
</html>
